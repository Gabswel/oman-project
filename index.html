const {useState} = React;

function ScoreDots({score,max=5}){
  return React.createElement('span',{style:{display:'flex',gap:3,alignItems:'center',justifyContent:'center'}},
    Array.from({length:max}).map((_,i)=>React.createElement('span',{key:i,style:{width:8,height:8,borderRadius:'50%',background:i<score?colors.navy:colors.border,display:'inline-block'}}))
  );
}

function Badge({risk}){
  const r=riskColor[risk];
  return React.createElement('span',{style:{background:r.bg,color:r.text,fontSize:11,fontWeight:500,padding:'2px 8px',borderRadius:20,border:`1px solid ${r.text}33`,whiteSpace:'nowrap'}},r.label);
}

function SectionTitle({children}){
  return React.createElement('div',{style:{fontSize:11,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:colors.gold,marginBottom:6,marginTop:16}},children);
}

    items.map((item,i)=>React.createElement('li',{key:i,style:{fontSize:13,color:colors.slate,paddingLeft:18,position:'relative',marginBottom:5,lineHeight:1.5}},
      React.createElement('span',{style:{position:'absolute',left:0,color:type==='pros'?colors.green:colors.red,fontWeight:700}},type==='pros'?'+':'−'),
      item

}

function RankingTable(){

  return React.createElement('div',{style:{background:colors.white,border:`1px solid ${colors.border}`,borderRadius:12,overflow:'hidden',marginBottom:20}},
    React.createElement('div',{style:{background:colors.navy,padding:'14px 20px'}},
      React.createElement('div',{style:{fontSize:15,fontWeight:600,color:colors.white}},'Ranking Matrix: All Structures'),
      React.createElement('div',{style:{fontSize:12,color:'rgba(255,255,255,0.6)',marginTop:2}},'Scored 1–5 across four dimensions')

    React.createElement('div',{style:{overflowX:'auto'}},
      React.createElement('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:13}},
        React.createElement('thead',null,
          React.createElement('tr',{style:{background:colors.bg}},

            dims.map(d=>React.createElement('th',{key:d,style:{textAlign:'center',padding:'10px 12px',fontWeight:500,color:colors.slateLight,fontSize:12}},dimLabels[d])),
            React.createElement('th',{style:{textAlign:'center',padding:'10px 12px',fontWeight:500,color:colors.slateLight,fontSize:12}},'Total')
          )

        React.createElement('tbody',null,
          rankingData.map((row,i)=>{
            const total=dims.reduce((s,d)=>s+row[d],0);

        tabs.map(t=>React.createElement('button',{key:t,onClick:()=>setActiveTab(t),style:{padding:'8px 16px',fontSize:13,fontWeight:activeTab===t?600:400,color:activeTab===t?colors.navy:colors.slateLight,background:'transparent',border:'none',borderBottom:activeTab===t?`2px solid ${colors.navy}`:'2px solid transparent',cursor:'pointer',whiteSpace:'nowrap',marginBottom:-1}},t))

            ),
            React.createElement('div',{style:{display:'flex',flexDirection:'column',gap:16}},
              filtered.map(s=>React.createElement(StructureCard,{key:s.id,s,activeTab}))
